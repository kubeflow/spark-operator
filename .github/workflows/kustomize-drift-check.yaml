# Detect semantic drift between the Helm chart (source of truth) and Kustomize manifests.
# Compares RBAC rules, webhook configurations, and deployment specs.
name: Kustomize Drift Check

on:
  pull_request:
    branches:
      - master
      - release-*
    paths:
      - 'config/**'
      - 'charts/**'
      - 'internal/**'
      - 'test/drift/**'
      - '.github/workflows/kustomize-drift-check.yaml'

  push:
    branches:
      - master
      - release-*
    paths:
      - 'config/**'
      - 'charts/**'
      - 'internal/**'
      - 'test/drift/**'
      - '.github/workflows/kustomize-drift-check.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.3.0 # zizmor: ignore[cache-poisoning] caching is intentional for CI jobs
        with:
          go-version-file: go.mod

      - name: Run drift detection
        run: make drift-check
