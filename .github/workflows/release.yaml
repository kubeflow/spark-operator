name: Release

on:
  push:
    branches:
      - master
      - release-*
    paths:
      - VERSION
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release branch
    if: github.repository == 'kubeflow/spark-operator'
    runs-on: ubuntu-latest

    environment:
      name: release

    permissions:
      contents: write

    outputs:
      version: ${{ steps.vars.outputs.version }}
      chart-version: ${{ steps.vars.outputs.chart-version }}
      pypi-version: ${{ steps.vars.outputs.pypi-version }}
      branch: ${{ steps.vars.outputs.branch }}
      is-prerelease: ${{ steps.vars.outputs.is-prerelease }}
      sha: ${{ steps.branch.outputs.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] credentials are needed to push the release branch
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check release assets
        id: vars
        run: hack/release/check-release.sh

      - name: Create or update release branch
        id: branch
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == "${BRANCH}" ]]; then
            echo "Triggered on ${BRANCH}; releasing from it directly."
          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
              echo "Using existing branch ${BRANCH}."
              git checkout -B "${BRANCH}" "origin/${BRANCH}"
              if git merge-base --is-ancestor "${SOURCE_SHA}" HEAD; then
                echo "Commit ${SOURCE_SHA} is already in ${BRANCH}; skipping cherry-pick."
              else
                # Only the release commit is cherry-picked. Fixes must already be on the
                # release branch (cherry-picked through their own PRs).
                parents=$(git rev-list --parents -n 1 "${SOURCE_SHA}" | wc -w)
                cherry_pick_args=(-x)
                if ((parents > 2)); then
                  cherry_pick_args+=(-m 1)
                fi
                if ! git cherry-pick "${cherry_pick_args[@]}" "${SOURCE_SHA}"; then
                  git cherry-pick --abort || true
                  echo "Cherry-pick of ${SOURCE_SHA} onto ${BRANCH} failed." >&2
                  echo "Open a PR with the release commit against ${BRANCH} instead." >&2
                  exit 1
                fi
              fi
            else
              echo "Creating ${BRANCH} from master@${SOURCE_SHA}."
              git checkout -B "${BRANCH}" "${SOURCE_SHA}"
            fi
            # The release branch must still be consistent after the cherry-pick.
            GITHUB_OUTPUT=/dev/null hack/release/check-release.sh
            # Pushes made with GITHUB_TOKEN do not trigger this workflow again.
            git push origin "HEAD:refs/heads/${BRANCH}"
          else
            echo "VERSION $(cat VERSION) must be released from master or ${BRANCH}, not ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Release commit: $(git rev-parse HEAD) on ${BRANCH}"

  verify:
    name: Verify release branch
    needs:
      - prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build operator
        run: go build ./...

      - name: Verify generated Python API is up to date
        run: |
          make python-api
          if ! git diff --exit-code -- api/; then
            echo "Generated Python API differs from the committed one. Run 'make python-api'." >&2
            exit 1
          fi

      - name: Run Helm unit tests
        run: make helm-unittest

      - name: Check Helm/Kustomize drift
        run: make drift-check

      - name: Validate Kustomize build
        run: make kustomize-lint

  build-python:
    name: Build Python package
    needs:
      - prepare
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Build and validate package
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.pypi-version }}
        run: |
          set -euo pipefail
          uv build api/python_api --out-dir dist
          uvx twine check --strict dist/*
          ls -l dist
          # Hatchling normalizes "2.6.0-rc.0" to the PEP 440 version "2.6.0rc0".
          test -f "dist/kubeflow_spark_api-${PYPI_VERSION}-py3-none-any.whl"
          test -f "dist/kubeflow_spark_api-${PYPI_VERSION}.tar.gz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-dist-${{ needs.prepare.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  create-tag:
    name: Create and push tag
    needs:
      - prepare
      - verify
      - build-python
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] credentials are needed to push the tag
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Create and push annotated tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            tagged=$(git rev-parse "refs/tags/${VERSION}^{commit}")
            if [[ "${tagged}" == "${SHA}" ]]; then
              echo "Tag ${VERSION} already points at ${SHA}; skipping."
              exit 0
            fi
            echo "Tag ${VERSION} already exists at ${tagged}, not at the release commit ${SHA}." >&2
            exit 1
          fi
          git tag -a "${VERSION}" -m "Kubeflow Spark Operator ${VERSION}" "${SHA}"
          git push origin "refs/tags/${VERSION}"

  publish-images:
    name: Build and publish images
    needs:
      - prepare
      - create-tag

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build-and-push-images.yaml
    with:
      ref: refs/tags/${{ needs.prepare.outputs.version }}
      version: ${{ needs.prepare.outputs.version }}
      publish: true
      export-binaries: true

  publish-chart:
    name: Publish Helm chart
    needs:
      - prepare
      - publish-images

    permissions:
      contents: write
      packages: write

    uses: ./.github/workflows/release-helm-charts.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      publish-oci: true

  publish-pypi:
    name: Publish to PyPI
    needs:
      - prepare
      - build-python
      - publish-images
      - publish-chart
    runs-on: ubuntu-latest

    environment:
      name: release
      url: https://pypi.org/project/kubeflow-spark-api/${{ needs.prepare.outputs.pypi-version }}/

    permissions:
      id-token: write

    steps:
      - name: Download Python package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-dist-${{ needs.prepare.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - create-tag
      - publish-images
      - publish-chart
      - publish-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Download operator binary archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/dist
          pattern: binaries-operator-*
          merge-multiple: true

      - name: Download Helm chart archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: helm-charts-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/dist

      - name: Download Python package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-dist-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/dist

      - name: Verify binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          verify="${RUNNER_TEMP}/verify"
          mkdir -p "${verify}"

          tar -xzf "${RUNNER_TEMP}/dist/spark-operator_${VERSION}_linux_amd64.tar.gz" \
            -C "${verify}" spark-operator
          "${verify}/spark-operator" version
          "${verify}/spark-operator" version | grep -qF "Git Version: ${VERSION}"
          "${verify}/spark-operator" version | grep -qF "Git Tree State: clean"
          "${verify}/spark-operator" --help > /dev/null

          rm -f "${verify}/spark-operator"
          tar -xzf "${RUNNER_TEMP}/dist/spark-operator_${VERSION}_linux_arm64.tar.gz" \
            -C "${verify}" spark-operator
          file "${verify}/spark-operator" | grep -q "ARM aarch64"
          file "${verify}/spark-operator" | grep -q "statically linked"

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/dist"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PYPI_VERSION: ${{ needs.prepare.outputs.pypi-version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            : > "${RUNNER_TEMP}/notes.md"
          else
            hack/release/extract-changelog.sh "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          fi
          {
            echo
            echo "## Installation"
            echo
            echo '```bash'
            echo "helm install spark-operator oci://ghcr.io/kubeflow/helm-charts/spark-operator \\"
            echo "  --version ${VERSION#v} --namespace spark-operator --create-namespace"
            echo '```'
            echo
            echo "Images: \`ghcr.io/kubeflow/spark-operator/controller:${VERSION#v}\`, \`ghcr.io/kubeflow/spark-operator/kubectl:${VERSION#v}\`"
            echo
            echo "Python API: \`pip install kubeflow-spark-api==${PYPI_VERSION}\`"
          } >> "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          if ! is_draft=$(gh release view "${VERSION}" --json isDraft --jq .isDraft 2>/dev/null); then
            # Create as a draft so all assets are attached before publication: with immutable
            # releases enabled, assets of a published release cannot be changed.
            args=(
              "${VERSION}"
              --verify-tag
              --draft
              --title "${VERSION}"
              --notes-file "${RUNNER_TEMP}/notes.md"
            )
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease --generate-notes)
            fi
            gh release create "${args[@]}" "${RUNNER_TEMP}"/dist/*
          elif [[ "${is_draft}" == "true" ]]; then
            echo "Draft release ${VERSION} exists; re-uploading assets."
            gh release upload "${VERSION}" --clobber "${RUNNER_TEMP}"/dist/*
          else
            echo "Release ${VERSION} is already published; leaving it unchanged."
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "${VERSION}" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "${VERSION}" --draft=false
          fi

  update-helm-index:
    name: Update Helm repository index
    needs:
      - prepare
      - github-release

    permissions:
      contents: write
      packages: write

    uses: ./.github/workflows/release-helm-charts.yaml
    with:
      version: ${{ needs.prepare.outputs.version }}
      update-index: true
