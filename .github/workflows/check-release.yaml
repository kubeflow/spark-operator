name: Check Release

on:
  pull_request:
    branches:
      - master
      - release-*
    paths:
      - VERSION
      - charts/spark-operator-chart/Chart.yaml
      - config/default/kustomization.yaml
      - api/python_api/kubeflow_spark_api/__init__.py
      - CHANGELOG.md
      - hack/release/**
      - .github/workflows/check-release.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect whether VERSION changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "${BASE_SHA}" HEAD -- VERSION; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release assets
        env:
          VERSION_CHANGED: ${{ steps.changed.outputs.version-changed }}
        run: |
          if [[ "${VERSION_CHANGED}" == "true" ]]; then
            hack/release/check-release.sh --require-new-tag
          else
            # VERSION is unchanged, but assets must stay consistent with it.
            hack/release/check-release.sh
          fi

      - name: Check release notes can be extracted
        if: steps.changed.outputs.version-changed == 'true'
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          if [[ "${VERSION}" == *-rc.* ]]; then
            echo "Release candidate ${VERSION}: release notes are generated by GitHub."
            exit 0
          fi
          hack/release/extract-changelog.sh "${VERSION}"
