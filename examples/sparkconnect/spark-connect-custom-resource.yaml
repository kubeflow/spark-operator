#
# This example shows the difference between Spark `cores` (task-slot count),
# Kubernetes `coreRequest`/`coreLimit` (physical CPU request/limit), and the
# `resources` section of a pod template. The CPU values are set differently in
# the CRD fields and in the pod templates below to show which one wins.
#
#   - `cores` controls the Spark task-slot count via `spark.driver.cores` and
#     `spark.executor.cores`. It is independent of physical CPU.
#
#   - For the server, the operator creates the pod directly (client mode setup),
#     so `spec.server.coreRequest`/`coreLimit` are applied to the operator-created
#     server pod's `resources.requests.cpu` / `resources.limits.cpu`. They do NOT
#     become `spark.kubernetes.driver.{request,limit}.cores`. A CPU value in the
#     server pod template is therefore overridden whenever the corresponding CRD
#     field is set, and is used only when that field is unset.
#
#   - For the executor, Spark creates the executor pods, so `executor.coreRequest`
#     and `executor.coreLimit` are passed to Spark as
#     `spark.kubernetes.executor.{request,limit}.cores`. Spark always sets the
#     executor container's CPU request, from that configuration when it is present
#     and `spark.executor.cores` otherwise, so a CPU request in the executor pod
#     template never takes effect. The limit from the pod template is used only
#     when `spec.executor.coreLimit` is unset.
#
#   - The values below are deliberately different for `coreRequest` and
#     `coreLimit` to demonstrate that they can be set independently.
#
apiVersion: sparkoperator.k8s.io/v1alpha1
kind: SparkConnect
metadata:
  name: spark-connect-custom-resource
  namespace: default
spec:
  sparkVersion: 4.0.4
  server:
    # Spark task-slot count for the driver. Independent of physical CPU.
    cores: 1
    # Operator-applied Kubernetes CPU request/limit for the operator-created
    # server pod. coreRequest (500m) is intentionally smaller than coreLimit
    # (1) to show they can differ.
    coreRequest: "500m"
    coreLimit: "1"
    memory: 1g
    template:
      metadata:
        labels:
          key1: value1
          key2: value2
        annotations:
          key3: value3
          key4: value4
      spec:
        containers:
        - name: spark-kubernetes-driver
          image: docker.io/apache/spark:4.0.4
          imagePullPolicy: Always
          # Ref: https://spark.apache.org/docs/latest/running-on-kubernetes.html#pod-template.
          resources:
            requests:
              # Overridden by `spec.server.coreRequest` above. Remove that field
              # and this value becomes the server pod's CPU request.
              cpu: 100m
              # Not overridden: the operator only manages the server pod's CPU,
              # so this memory request is applied to the pod as-is.
              memory: 1Gi
            limits:
              # Overridden by `spec.server.coreLimit` above.
              cpu: 100m
              memory: 1Gi
        serviceAccount: spark-operator-spark
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 185
          runAsUser: 185
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
  executor:
    instances: 2
    # Spark task-slot count for executors. Independent of physical CPU.
    cores: 2
    # Maps to `spark.kubernetes.executor.{request,limit}.cores` and is
    # applied by Spark when it creates the executor pods. The values
    # `500m` and `1500m` differ to illustrate that coreRequest can be
    # smaller than coreLimit.
    coreRequest: "500m"
    coreLimit: "1500m"
    memory: 512m
    template:
      metadata:
        labels:
          key1: value1
          key2: value2
        annotations:
          key3: value3
          key4: value4
      spec:
        containers:
        - name: spark-kubernetes-executor
          image: docker.io/apache/spark:4.0.4
          imagePullPolicy: Always
          # Ref: https://spark.apache.org/docs/latest/running-on-kubernetes.html#pod-template.
          resources:
            requests:
              # Never used: Spark always overwrites the executor CPU request,
              # from `spec.executor.coreRequest` when set and `spec.executor.cores`
              # otherwise.
              cpu: 1
              # Please use `spec.executor.memory` instead.
              memory: 1Gi
            limits:
              # Overridden by `spec.executor.coreLimit` above. Remove that field
              # and this value becomes the executor pod's CPU limit.
              cpu: 2
              # Please use `spec.executor.memory` instead.
              memory: 1512Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 185
          runAsUser: 185
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
