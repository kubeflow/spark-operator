apiVersion: sparkoperator.k8s.io/v1alpha1
kind: SparkConnect
metadata:
  name: spark-connect-dependencies
  namespace: default
spec:
  sparkVersion: 4.0.4
  deps:
    jars:
    - https://repo1.maven.org/maven2/com/google/re2j/re2j/1.8/re2j-1.8.jar
    packages:
    # spark-avro must match the image's Spark version
    - org.apache.spark:spark-avro_2.13:4.0.4
    excludePackages:
    - org.tukaani:xz
    - org.apache.spark:spark-tags_2.13
    # repositories:
    # - https://packages.confluent.io/maven/   # only for artifacts not on Maven Central
  server:
    template:
      metadata:
        labels:
          key1: value1
          key2: value2
        annotations:
          key3: value3
          key4: value4
      spec:
        containers:
        - name: spark-kubernetes-driver
          image: docker.io/apache/spark:4.0.4
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 1
              memory: 1Gi
        serviceAccount: spark-operator-spark
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 185
          runAsUser: 185
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
  executor:
    instances: 2
    cores: 1
    memory: 512m
    template:
      metadata:
        labels:
          key1: value1
          key2: value2
        annotations:
          key3: value3
          key4: value4
      spec:
        containers:
        - name: spark-kubernetes-executor
          image: docker.io/apache/spark:4.0.4
          imagePullPolicy: Always
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 185
          runAsUser: 185
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
