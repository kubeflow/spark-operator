# RBAC Kustomization
# All Role-Based Access Control resources consolidated

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Controller ClusterRole (auto-generated by controller-gen from Go markers)
  - role.yaml
  - clusterrolebinding.yaml
  - leader-election-role.yaml
  - rolebinding.yaml
  # Editor/Viewer ClusterRoles
  - sparkapplication_viewer_role.yaml
  - sparkapplication_editor_role.yaml
  - scheduledsparkapplication_viewer_role.yaml
  - scheduledsparkapplication_editor_role.yaml
  # Read-only access to the public ConfigMap for all authenticated users
  - public_configmap_role.yaml
  - public_configmap_role_binding.yaml
