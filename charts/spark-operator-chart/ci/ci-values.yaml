image:
  tag: local

# Configure spark jobs to run in:
# 1. "default" namespace explicitly (for core e2e tests)
# 2. Any namespace with "spark=enabled" label (for namespace filtering tests)
# This uses OR logic: namespace is watched if in list OR matches selector
spark:
  jobNamespaces:
    - default
  jobNamespaceSelector: "spark=enabled"

controller:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
  driverPodDisruptionBudget:
    enable: true

webhook:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
  # Enable URL validation so E2E exercises local URLs plus configured remote-host policy.
  urlSchemeValidation:
    enable: true
    allowedSchemes:
      - https
    allowedHosts:
      - https://test1.example.com
