image:
  tag: local

# Configure spark jobs to run in:
# 1. "default" namespace explicitly (for core e2e tests)
# 2. Any namespace with "spark=enabled" label (for namespace filtering tests)
# This uses OR logic: namespace is watched if in list OR matches selector
spark:
  jobNamespaces:
    - default
  jobNamespaceSelector: "spark=enabled"
  # Must match jobNamespaceSelector in structured form. Label the `default`
  # namespace with spark=enabled in e2e so name-listed and label-selected
  # namespaces both pass the API-server webhook gate.
  webhookNamespaceSelector:
    matchLabels:
      spark: enabled

controller:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
  driverPodDisruptionBudget:
    enable: true

webhook:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
