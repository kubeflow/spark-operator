suite: Test public ConfigMap

templates:
  - public/configmap.yaml

release:
  name: spark-operator
  namespace: spark-operator

chart:
  version: 2.5.0
  appVersion: 2.5.0

tests:
  - it: Should create the public ConfigMap by default
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: ConfigMap
          name: kubeflow-spark-public
          namespace: spark-operator

  - it: Should not create the public ConfigMap if `publicConfigMap.create` is false
    set:
      publicConfigMap:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Should expose the control-plane version with a `v` prefix
    asserts:
      - equal:
          path: data.kubeflow_spark_version
          value: v2.5.0

  - it: Should not duplicate the `v` prefix if the appVersion already has one
    chart:
      appVersion: v2.5.0-rc.1
    asserts:
      - equal:
          path: data.kubeflow_spark_version
          value: v2.5.0-rc.1

  - it: Should use a fixed name regardless of the release name
    release:
      name: another-release
    asserts:
      - equal:
          path: metadata.name
          value: kubeflow-spark-public

  - it: Should add common labels
    set:
      commonLabels:
        key1: value1
    asserts:
      - equal:
          path: metadata.labels.key1
          value: value1
