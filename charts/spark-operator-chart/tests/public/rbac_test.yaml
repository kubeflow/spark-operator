suite: Test public ConfigMap RBAC

templates:
  - public/rbac.yaml

release:
  name: spark-operator
  namespace: spark-operator

tests:
  - it: Should not create RBAC resources if `publicConfigMap.create` is false
    set:
      publicConfigMap:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Should create a Role granting read-only access to the public ConfigMap only
    documentIndex: 0
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          name: kubeflow-spark-public
          namespace: spark-operator
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - configmaps
              resourceNames:
                - kubeflow-spark-public
              verbs:
                - get
                - list
                - watch

  - it: Should bind the Role to all authenticated users
    documentIndex: 1
    asserts:
      - containsDocument:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          name: kubeflow-spark-public
          namespace: spark-operator
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: kubeflow-spark-public
      - contains:
          path: subjects
          content:
            apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: system:authenticated
          count: 1
